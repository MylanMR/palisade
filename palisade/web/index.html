<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palisade</title>
<style>
  :root {
    --paper: #ECEEF0; --panel: #FFFFFF; --ink: #1A1F26; --muted: #5B6470;
    --rule: #D3D7DC; --ok: #245C8A; --flag: #A8681C; --block: #9B3A32;
    --font: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: 100%; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

  main { display: flex; flex-direction: column; min-width: 0; }
  header { padding: 18px 28px 10px; border-bottom: 1px solid var(--rule); }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  #log { flex: 1; overflow-y: auto; padding: 20px 28px; }
  .turn { max-width: 72ch; margin: 0 0 26px; }
  .who { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .text { white-space: pre-wrap; word-wrap: break-word; }
  .ledger { margin-top: 8px; padding-left: 12px; border-left: 3px solid var(--ok); font-size: 13px; color: var(--muted); }
  .ledger.flagged { border-color: var(--flag); }
  .ledger.blocked_input, .ledger.blocked_output { border-color: var(--block); }
  .ledger b { color: var(--ink); font-weight: 600; }
  .ledger code { font: 12px var(--mono); }
  .empty { color: var(--muted); max-width: 60ch; }

  form { display: flex; gap: 10px; padding: 14px 28px 20px; border-top: 1px solid var(--rule); background: var(--panel); }
  textarea { flex: 1; resize: none; min-height: 48px; max-height: 200px; padding: 10px 12px; font: inherit; border: 1px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink); }
  textarea:focus, button:focus-visible { outline: 2px solid var(--ok); outline-offset: 1px; }
  button { padding: 0 18px; font: inherit; font-weight: 600; border: 0; border-radius: 4px; background: var(--ink); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }

  aside { border-left: 1px solid var(--rule); background: var(--panel); padding: 18px 20px; overflow-y: auto; font-size: 14px; }
  @media (max-width: 900px) { aside { border-left: 0; border-top: 1px solid var(--rule); } }
  aside h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  aside section { margin-bottom: 22px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  dd code { font: 12px var(--mono); }
  .chain-ok { color: var(--ok); } .chain-bad { color: var(--block); font-weight: 600; }
  .err { color: var(--block); }
</style>
</head>
<body>
<div class="app">
  <main>
    <header>
      <h1>Palisade</h1>
      <p>Local assistant. Every exchange is checked against policy and written to a hash-chained audit log.</p>
    </header>
    <div id="log">
      <p class="empty">Ask something. Below each answer you will see the decision, the guardian scores, and the audit record it produced.</p>
    </div>
    <form id="f">
      <textarea id="msg" placeholder="Message" rows="2" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <aside>
    <section>
      <h2>Runtime</h2>
      <dl id="status"><dt>Loading</dt><dd></dd></dl>
    </section>
    <section>
      <h2>Audit chain</h2>
      <dl id="chain"><dt></dt><dd></dd></dl>
    </section>
  </aside>
</div>
<script>
const $ = s => document.querySelector(s);
const log = $('#log'), form = $('#f'), msg = $('#msg'), send = $('#send');
const history = [];

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function short(h) { return h ? h.slice(0, 12) : ''; }

function addTurn(who, text) {
  log.querySelector('.empty')?.remove();
  const t = el('div', 'turn');
  t.appendChild(el('div', 'who', who));
  t.appendChild(el('div', 'text', text));
  log.appendChild(t); log.scrollTop = log.scrollHeight;
  return t;
}

function ledger(turn, r) {
  const d = el('div', 'ledger ' + r.decision);
  const label = { answered: 'Answered', flagged: 'Answered, flagged for review',
                  blocked_input: 'Blocked at input', blocked_output: 'Blocked at output' }[r.decision] || r.decision;
  const scores = r.verdicts.map(v => `${v.stage} ${v.p_violation.toFixed(2)}${v.categories.length ? ' (' + v.categories.join(', ') + ')' : ''}`).join(' · ');
  d.innerHTML = `<b>${label}</b> · guardian ${scores || 'skipped'} · ${r.latency_ms} ms<br>record #${r.audit.seq} <code>${short(r.audit.hash)}</code> follows <code>${short(r.audit.prev_hash)}</code>`;
  turn.appendChild(d);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || res.statusText);
  return j;
}

function renderStatus(s) {
  $('#status').innerHTML = [
    ['Assistant', s.base_model], ['Guardian', `${s.guardian_model} (${s.guardian_mode}, threshold ${s.threshold})`],
    ['Policy', 'v' + s.policy_version], ['Manifest', `<code>${short(s.manifest_hash)}</code>`],
  ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  renderChain(s.audit);
}
function renderChain(a) {
  $('#chain').innerHTML = [
    ['Records', a.records],
    ['Integrity', a.intact ? '<span class="chain-ok">intact</span>' : `<span class="chain-bad">broken at #${a.first_break?.seq}</span>`],
    ['Head', `<code>${short(a.head_hash)}</code>`],
  ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = msg.value.trim(); if (!text) return;
  msg.value = ''; send.disabled = true;
  addTurn('You', text);
  const turn = addTurn('Assistant', '…');
  try {
    const r = await api('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history }) });
    turn.querySelector('.text').textContent = r.response;
    ledger(turn, r);
    history.push({ role: 'user', content: text });
    if (r.decision === 'answered' || r.decision === 'flagged') history.push({ role: 'assistant', content: r.response });
    renderChain(await api('/api/audit/verify'));
  } catch (err) {
    turn.querySelector('.text').textContent = 'Request failed: ' + err.message;
    turn.querySelector('.text').classList.add('err');
  } finally { send.disabled = false; msg.focus(); }
});
msg.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

api('/api/status').then(renderStatus).catch(e => { $('#status').innerHTML = `<dt class="err">Error</dt><dd>${e.message}</dd>`; });
</script>
</body>
</html>
