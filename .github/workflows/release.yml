name: release

# Builds the macOS, Windows, and Linux installers, installs each one on a clean runner to
# prove it works, and (for a version tag) signs, notarizes, attests, and publishes them as a
# draft GitHub release for review.
#
#   push a tag v0.3.0         signed release build; fails if any signing secret is missing
#   Actions > release > Run    unsigned test build (installers named *-UNSIGNED), artifacts only
#
# Required secrets for a signed release are listed in packaging/SIGNING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      signed:
        description: "Sign and notarize (needs all signing secrets)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  SIGNED: ${{ github.ref_type == 'tag' || inputs.signed == true }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Tag matches palisade.__version__
        if: github.ref_type == 'tag'
        run: |
          v=$(python -c 'import palisade; print(palisade.__version__)')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: Model hashes match Hugging Face
        # Independent check of the hashes in models.yaml. Required for a signed release.
        continue-on-error: ${{ env.SIGNED != 'true' }}
        run: python packaging/hf_hashes.py

  linux:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Build .deb and .rpm
        run: packaging/linux/build.sh dist
      - name: Install test (service mode under systemd)
        run: |
          set -x
          sudo apt-get install -y ./dist/palisade_*_amd64.deb
          sudo useradd -m -G sudo reviewer
          sudo palisade-mode service reviewer
          sleep 20
          systemctl is-active palisade.service
          [ "$(systemctl show -p User --value palisade.service)" = palisade ]
          curl -sf http://127.0.0.1:8080/ | grep -q "Setting up Palisade"
          sudo -u palisade touch /var/lib/palisade/models/x && exit 1 || echo "service cannot write models: ok"
          sudo -u palisade sh -c 'echo x >> /etc/palisade/policy.yaml' && exit 1 || echo "service cannot edit policy: ok"
          sudo -u reviewer palisade audit verify
          sudo apt-get remove -y palisade
          ! systemctl is-active palisade.service
          test -d /var/lib/palisade/audit
      - name: Sign (detached OpenPGP signatures)
        if: env.SIGNED == 'true'
        env:
          GPG_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          [ -n "$GPG_KEY" ] || { echo "LINUX_GPG_PRIVATE_KEY is not set"; exit 1; }
          export GNUPGHOME=$(mktemp -d)
          echo "$GPG_KEY" | gpg --batch --import
          for f in dist/*.deb dist/*.rpm; do
            gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$f"
          done
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    needs: check
    runs-on: macos-15          # Apple Silicon. Intel Macs: add a macos-x64 job on an Intel runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Import signing certificates and notary key
        if: env.SIGNED == 'true'
        env:
          CERTS_P12: ${{ secrets.MACOS_CERTS_P12_BASE64 }}
          CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          for v in CERTS_P12 CERTS_PASSWORD NOTARY_KEY_P8; do [ -n "${!v}" ] || { echo "secret for $v is not set"; exit 1; }; done
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpass=$(openssl rand -hex 24)
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          echo "$CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certs.p12"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "MACOS_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build .pkg and .dmg
        env:
          PALISADE_UNSIGNED: ${{ env.SIGNED == 'true' && '0' || '1' }}
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: packaging/macos/build.sh macos-arm64 dist
      - name: Install test (service mode under launchd)
        run: |
          set -x
          pkg=$(ls dist/*.pkg)
          sudo installer -pkg "$pkg" -target / -dumplog
          sleep 20
          sudo launchctl print system/com.palisade.server | grep -E 'state|pid'
          dscl . -read /Users/_palisade UniqueID
          curl -sf http://127.0.0.1:8080/ | grep -q "Setting up Palisade"
          sudo -u _palisade touch "/Library/Application Support/Palisade/data/models/x" && exit 1 || echo "service cannot write models: ok"
          codesign --verify --strict /opt/palisade/llama/llama-server || [ "$PALISADE_UNSIGNED" = 1 ]
          sudo /opt/palisade/uninstall.sh
          ! launchctl print system/com.palisade.server 2>/dev/null
          test -d "/Library/Application Support/Palisade/data/audit"
        env:
          PALISADE_UNSIGNED: ${{ env.SIGNED == 'true' && '0' || '1' }}
      - name: Desktop-mode choice is accepted by Installer
        run: |
          pkg=$(ls dist/*.pkg)
          installer -pkg "$pkg" -showChoicesXML -target / > choices.xml
          grep -q '<string>desktop</string>' choices.xml && grep -q '<string>service</string>' choices.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.pkg
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write          # OIDC login to Azure for code signing; no stored client secret
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Install WiX (pinned)
        run: |
          $v = python -c "import yaml; print(yaml.safe_load(open('packaging/inputs.yaml'))['wix']['version'])"
          dotnet tool install --global wix --version $v
          wix extension add -g "WixToolset.UI.wixext/$v" "WixToolset.Util.wixext/$v" "WixToolset.BootstrapperApplications.wixext/$v"
      - name: Payload
        run: packaging/windows/build.ps1 -Stage Payload
      - name: Azure login (OIDC)
        if: env.SIGNED == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign payload (exe, dll, pyd, ps1)
        if: env.SIGNED == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: build/payload-windows-x64
          files-folder-filter: exe,dll,pyd,ps1
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Palisade
          description-url: https://github.com/MylanMR/palisade
      - name: Add the Visual C++ runtime (Microsoft-signed) and rehash the model server
        run: packaging/windows/build.ps1 -Stage Rehash
      - name: MSI
        run: packaging/windows/build.ps1 -Stage Msi
      - name: Sign MSI
        if: env.SIGNED == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Palisade
      - name: Bundle (.exe) and detach its engine
        run: packaging/windows/build.ps1 -Stage Bundle
      - name: Sign bundle engine
        if: env.SIGNED == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files: ${{ github.workspace }}\build\windows\engine.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Reattach engine
        run: packaging/windows/build.ps1 -Stage Reattach
      - name: Sign bundle
        if: env.SIGNED == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Palisade
      - name: Mark unsigned test builds
        if: env.SIGNED != 'true'
        run: Get-ChildItem dist -File | ForEach-Object { Rename-Item $_.FullName ($_.BaseName + '-UNSIGNED' + $_.Extension) }
      - name: Install test (service mode, virtual account)
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn PALISADE_MODE=service PALISADE_REVIEWER=$env:COMPUTERNAME\$env:USERNAME /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; throw "install failed ($($p.ExitCode))" }
          Start-Sleep -Seconds 25
          $svc = Get-CimInstance Win32_Service -Filter "Name='Palisade'"
          "service: $($svc.State) as $($svc.StartName)"
          if ($svc.StartName -ne 'NT SERVICE\Palisade') { throw "service runs as $($svc.StartName)" }
          Get-ScheduledTask -TaskName 'Palisade Setup' | Format-Table TaskName, State
          if (-not ((Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing).Content -match 'Setting up Palisade')) { throw 'setup page not served' }
          icacls "$env:ProgramData\Palisade\data\models"
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed ($($p.ExitCode))" }
          if (Get-Service Palisade -ErrorAction SilentlyContinue) { throw 'service left behind' }
          if (-not (Test-Path "$env:ProgramData\Palisade\data")) { throw 'data was deleted on uninstall' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows
          path: |
            dist/*.msi
            dist/*.exe
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # create the draft release
      id-token: write          # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance attestation (verify with `gh attestation verify FILE -R MylanMR/palisade`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Palisade ${GITHUB_REF_NAME#v}" \
            --notes "Installers for macOS, Windows, and Linux. Check a download against SHA256SUMS, or verify its build provenance: gh attestation verify FILE -R $GITHUB_REPOSITORY. Review this draft before publishing."
