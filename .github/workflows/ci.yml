name: ci
on:
  push:
    branches: [main]
  pull_request:

# The workflow token can only read the repository. Nothing in CI needs to write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.12"]
    steps:
      # Actions are pinned to full commit SHAs; a tag can be moved by its publisher, a SHA cannot.
      # Dependabot (.github/dependabot.yml) proposes updates when new releases appear.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (exact versions, hash-verified)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Unit and integration tests
        run: python -m pytest tests/ -q
      - name: NIST AI RMF benchmark (must run clean)
        run: python -m palisade benchmark

  # The harness against the real model server: the pinned llama-server build (hash-checked
  # against config/models.yaml) running a tiny generated model. Proves the lockdown flags,
  # the key, the private sockets, and the tokenizer probe on the actual binary.
  harness-live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (exact versions, hash-verified)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-harness.lock
      - name: Fetch the pinned llama-server build (hash-verified)
        run: |
          server="$(python packaging/test_llama_server.py "$RUNNER_TEMP/llama")"
          echo "PALISADE_TEST_LLAMA_SERVER=$server" >> "$GITHUB_ENV"
      - name: Live harness tests (must run, not skip)
        env:
          PALISADE_TEST_REQUIRE_LIVE: "1"
        run: python -m pytest tests/test_harness_live.py -v
