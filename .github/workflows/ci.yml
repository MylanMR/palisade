name: ci
on:
  push:
    branches: [main]
  pull_request:

# The workflow token can only read the repository. Nothing in CI needs to write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.12"]
    steps:
      # Actions are pinned to full commit SHAs; a tag can be moved by its publisher, a SHA cannot.
      # Dependabot (.github/dependabot.yml) proposes updates when new releases appear.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (exact versions, hash-verified)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Unit and integration tests
        run: python -m pytest tests/ -q
      - name: NIST AI RMF benchmark (must run clean)
        run: python -m palisade benchmark
